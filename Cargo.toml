[package]
name = "mod-combatlog"
version = "0.2.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[features]
# The `player_leaving` hook of horizon-rust/horizon#18762 (heard while the player is still in the world): the logout kill
# then happens at the quit, as in the original. Off by default: the SDK this mod is pinned to does not have the hook yet.
horizon_player_leaving = []

